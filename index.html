<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bitrate</title>
<style>
  :root{
    --bg-tertiary:#1e1f22; --bg-secondary:#2b2d31; --bg-primary:#313338;
    --bg-floating:#111214; --bg-input:#1e1f22; --bg-modifier-hover:rgba(78,80,88,.4);
    --text-normal:#dbdee1; --text-muted:#949ba4; --blurple:#5865f2;
    --blurple-hover:#4752c4; --green:#23a55a; --red:#f23f43; --divider:#3f4147;
  }
  body.light{
    --bg-tertiary:#e3e5e8; --bg-secondary:#f2f3f5; --bg-primary:#ffffff;
    --bg-floating:#ffffff; --bg-input:#ebedef; --bg-modifier-hover:rgba(6,6,7,.06);
    --text-normal:#060607; --text-muted:#5c5e66; --divider:#e3e5e8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0; font-family:"gg sans","Noto Sans",Helvetica,Arial,sans-serif; background:var(--bg-tertiary); color:var(--text-normal); overflow:hidden;}
  #app{display:flex;height:100vh;width:100vw;}
  
  /* Rail */
  #rail{width:72px;background:var(--bg-tertiary);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px;flex-shrink:0;}
  .rail-btn{width:48px;height:48px;border-radius:50%;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;color:var(--text-normal);border:none;}
  .rail-btn.active,.rail-btn:hover{border-radius:16px;background:var(--blurple);color:#fff;}
  .rail-spacer{flex:1;}

  /* Sidebar */
  #sidebar{width:240px;background:var(--bg-secondary);display:flex;flex-direction:column;flex-shrink:0;}
  #search-bar{padding:10px;border-bottom:1px solid var(--divider);}
  #search-bar input{width:100%;background:var(--bg-input);border:none;border-radius:4px;padding:6px 8px;color:var(--text-normal);font-size:13px;outline:none;}
  #friends-header{padding:16px 10px 6px;font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;}
  #add-friend-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px;}
  #friend-list{flex:1;overflow-y:auto;padding:0 6px;}
  .friend-item{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer;margin-bottom:2px;}
  .friend-item:hover{background:var(--bg-modifier-hover);}
  .user-bar{background:var(--bg-secondary);border-top:1px solid var(--divider);padding:8px;display:flex;align-items:center;gap:8px;}
  .user-bar-info{flex:1;min-width:0;}
  .user-bar-name{font-size:13px;font-weight:600;color:var(--text-normal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-bar-tag{font-size:11px;color:var(--text-muted);}
  .icon-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:6px;border-radius:4px;display:flex;}
  
  /* Avatar */
  .avatar{border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;background:linear-gradient(135deg,#5865f2,#3b4bd6);overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}

  /* Main */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-primary);}
  #chat-header{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--divider);}
  #messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:2px;}
  #composer{padding:0 16px 20px;}
  .composer-box{background:var(--bg-input);border-radius:8px;padding:12px;color:var(--text-normal);}
  
  /* Modals */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;}
  .hidden{display:none !important;}
  .modal{background:var(--bg-floating);border-radius:8px;width:440px;padding:16px;}
  .field-input{width:100%;background:var(--bg-input);border:none;border-radius:4px;padding:10px;color:var(--text-normal);margin-bottom:14px;}
  .btn{background:var(--blurple);color:#fff;border:none;border-radius:4px;padding:10px 18px;cursor:pointer;}
  .toggle{width:40px;height:22px;border-radius:11px;background:#80848e;position:relative;cursor:pointer;border:none;}
  .toggle.on{background:var(--green);}
  .toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;}
  .toggle.on .knob{left:20px;}
  
  /* Mobile Adjustments */
  @media (max-width:768px){
    #rail{width:56px;}
    #sidebar{width:100%;flex:1;}
    #app.chat-open #sidebar, #app.chat-open #rail{display:none;}
    #app:not(.chat-open) #main{display:none;}
    #back-to-friends-btn{display:flex !important;}
  }
</style>
</head>
<body>

<div id="loading-screen">Загрузка...</div>

<div id="login-screen" class="hidden">
  <div id="login-box" style="background:var(--bg-floating);border-radius:8px;padding:32px;width:400px;text-align:center;">
    <h1>Bitrate</h1>
    <input id="login-username" class="field-input" placeholder="ваш_юзернейм" />
    <button class="btn" id="login-btn" style="width:100%;">Продолжить</button>
    <div id="login-error" style="color:#f23f43;margin-top:10px;"></div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="rail">
    <button class="rail-btn active">💬</button>
    <div class="rail-spacer"></div>
  </div>

  <div id="sidebar">
    <div id="search-bar"><input placeholder="Найти..." /></div>
    <div id="friend-list"></div>
    <div class="user-bar">
      <div class="avatar" id="my-avatar" style="width:32px;height:32px;"></div>
      <div class="user-bar-info">
        <div class="user-bar-name" id="my-nickname"></div>
        <div class="user-bar-tag" id="my-username"></div>
      </div>
      <button class="icon-btn" id="settings-btn-bar">⚙️</button>
    </div>
  </div>

  <div id="main">
    <div id="chat-view" class="hidden" style="display:flex;flex-direction:column;height:100%;">
      <div id="chat-header">
        <span id="chat-title"></span>
      </div>
      <div id="messages"></div>
      <div id="composer"><input id="message-input" class="composer-box" style="width:100%;border:none;outline:none;" placeholder="Сообщение..." /></div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay hidden" id="settings-overlay">
  <div class="modal">
    <h2>Настройки профиля</h2>
    <label>Никнейм</label>
    <input class="field-input" id="nickname-input" />
    <label>Юзернейм (раз в 7 дней)</label>
    <input class="field-input" id="username-input" />
    <button class="btn" id="save-settings-btn">Сохранить</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = { /* Вставьте сюда ваш конфиг */ };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let me = null;
const ADMIN_UID = "tamirlan_dev"; // Или используйте реальный UID пользователя

function $(id){ return document.getElementById(id); }

onAuthStateChanged(auth, async (user) => {
  if(!user) return;
  const userDoc = await getDoc(doc(db, "users", user.uid));
  if(userDoc.exists()){
    me = { uid: user.uid, ...userDoc.data() };
    renderMyProfile();
    $("loading-screen").classList.add("hidden");
    $("app").classList.remove("hidden");
  } else {
    $("login-screen").classList.remove("hidden");
  }
});

$("login-btn").onclick = async () => {
  const raw = $("login-username").value.trim();
  const profile = { username: raw, nickname: raw, lastUsernameChange: serverTimestamp(), isVerified: false };
  await setDoc(doc(db,"users",auth.currentUser.uid), profile);
  me = { uid: auth.currentUser.uid, ...profile };
  location.reload();
};

function renderMyProfile(){
  $("my-nickname").textContent = me.nickname + (me.isVerified ? " ✅" : "");
  $("my-username").textContent = "@" + me.username;
}

$("settings-btn-bar").onclick = () => {
  $("nickname-input").value = me.nickname;
  $("username-input").value = me.username;
  $("settings-overlay").classList.remove("hidden");
};

$("save-settings-btn").onclick = async () => {
  const newNick = $("nickname-input").value.trim();
  const newUsr = $("username-input").value.trim();
  
  const updateData = { nickname: newNick };
  
  // Проверка на 7 дней
  if (newUsr !== me.username) {
    const lastChange = me.lastUsernameChange?.toDate().getTime() || 0;
    const sevenDays = 7 * 24 * 60 * 60 * 1000;
    
    if (Date.now() - lastChange < sevenDays) {
      alert("Юзернейм можно менять только раз в 7 дней!");
      return;
    }
    updateData.username = newUsr;
    updateData.lastUsernameChange = serverTimestamp();
  }

  await updateDoc(doc(db, "users", me.uid), updateData);
  me = { ...me, ...updateData };
  renderMyProfile();
  $("settings-overlay").classList.add("hidden");
};

// Функция для админа (вызов где-то в списке юзеров)
async function toggleVerification(targetUid, currentStatus) {
  if (me.username !== "tamirlan_dev") return;
  await updateDoc(doc(db, "users", targetUid), { isVerified: !currentStatus });
}
</script>
</body>
</html>
