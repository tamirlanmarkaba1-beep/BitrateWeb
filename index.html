<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bitrate</title>
<style>
  :root{
    --bg-tertiary:#1e1f22;
    --bg-secondary:#2b2d31;
    --bg-secondary-alt:#2b2d31;
    --bg-primary:#313338;
    --bg-floating:#111214;
    --bg-input:#1e1f22;
    --bg-modifier-hover:rgba(78,80,88,.4);
    --text-normal:#dbdee1;
    --text-muted:#949ba4;
    --text-link:#00a8fc;
    --blurple:#5865f2;
    --blurple-hover:#4752c4;
    --green:#23a55a;
    --yellow:#f0b232;
    --red:#f23f43;
    --header-bg:#313338;
    --divider:#3f4147;
  }
  body.light{
    --bg-tertiary:#e3e5e8;
    --bg-secondary:#f2f3f5;
    --bg-primary:#ffffff;
    --bg-floating:#ffffff;
    --bg-input:#ebedef;
    --bg-modifier-hover:rgba(6,6,7,.06);
    --text-normal:#060607;
    --text-muted:#5c5e66;
    --divider:#e3e5e8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"gg sans","Noto Sans",Helvetica,Arial,sans-serif;
    background:var(--bg-tertiary);
    color:var(--text-normal);
    overflow:hidden;
  }
  #app{display:flex;height:100vh;width:100vw;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:4px;}
  body.light ::-webkit-scrollbar-thumb{background:#c7c9cd;}

  /* ---------- server rail ---------- */
  #rail{
    width:72px;background:var(--bg-tertiary);
    display:flex;flex-direction:column;align-items:center;
    padding:12px 0;gap:8px;flex-shrink:0;
  }
  .rail-btn{
    width:48px;height:48px;border-radius:50%;background:var(--bg-primary);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:.15s;color:var(--text-normal);border:none;
  }
  .rail-btn.active,.rail-btn:hover{border-radius:16px;background:var(--blurple);color:#fff;}
  .rail-sep{width:32px;height:2px;background:var(--divider);border-radius:1px;margin:4px 0;}
  .rail-spacer{flex:1;}

  /* ---------- friends sidebar ---------- */
  #sidebar{width:240px;background:var(--bg-secondary);display:flex;flex-direction:column;flex-shrink:0;}
  #search-bar{padding:10px;border-bottom:1px solid var(--divider);}
  #search-bar input{
    width:100%;background:var(--bg-input);border:none;border-radius:4px;
    padding:6px 8px;color:var(--text-normal);font-size:13px;outline:none;
  }
  #friends-header{
    padding:16px 10px 6px;font-size:11px;font-weight:700;color:var(--text-muted);
    text-transform:uppercase;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center;
  }
  #add-friend-btn{
    background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px;
    display:flex;align-items:center;
  }
  #add-friend-btn:hover{color:var(--text-normal);}
  #friend-list{flex:1;overflow-y:auto;padding:0 6px;}
  .friend-item{
    display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;
    cursor:pointer;margin-bottom:2px;position:relative;
  }
  .friend-item:hover{background:var(--bg-modifier-hover);}
  .friend-item.active{background:var(--bg-modifier-hover);}
  .friend-name{font-size:14px;font-weight:500;color:var(--text-normal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;}
  .friend-status{font-size:12px;color:var(--text-muted);}
  .empty-hint{padding:16px;font-size:12px;color:var(--text-muted);text-align:center;}

  #user-bar{
    background:var(--bg-secondary);border-top:1px solid var(--divider);
    padding:8px;display:flex;align-items:center;gap:8px;
  }
  .user-bar-info{flex:1;min-width:0;}
  .user-bar-name{font-size:13px;font-weight:600;color:var(--text-normal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px;}
  .user-bar-tag{font-size:11px;color:var(--text-muted);}
  .icon-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:6px;border-radius:4px;display:flex;}
  .icon-btn:hover{color:var(--text-normal);background:var(--bg-modifier-hover);}

  /* ---------- avatar ---------- */
  .avatar{border-radius:50%;position:relative;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;background:linear-gradient(135deg,#5865f2,#3b4bd6);overflow:hidden;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .status-dot{position:absolute;bottom:-1px;right:-1px;border-radius:50%;border:3px solid var(--bg-secondary);}

  /* ---------- main chat ---------- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-primary);}
  #chat-header{
    height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;border-bottom:1px solid var(--divider);box-shadow:0 1px 0 rgba(0,0,0,.1);
  }
  .header-left{display:flex;align-items:center;gap:8px;font-weight:600;}
  .header-right{display:flex;align-items:center;gap:16px;}
  .header-right .icon-btn{color:var(--text-muted);}
  #messages{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:2px;}
  .msg-row{display:flex;gap:12px;padding:6px 0;border-radius:6px;}
  .msg-row:hover{background:var(--bg-modifier-hover);}
  .msg-body{flex:1;min-width:0;}
  .msg-meta{display:flex;align-items:baseline;gap:8px;}
  .msg-author{font-weight:600;font-size:15px;color:var(--text-normal);display:inline-flex;align-items:center;gap:4px;}
  .msg-time{font-size:11px;color:var(--text-muted);}
  .msg-text{font-size:15px;color:var(--text-normal);line-height:1.4;word-break:break-word;}
  #empty-chat{margin:auto;text-align:center;color:var(--text-muted);}
  #composer{padding:0 16px 20px;flex-shrink:0;}
  .composer-box{background:var(--bg-input);border-radius:8px;display:flex;align-items:center;padding:0 12px;}
  .composer-box input{
    flex:1;background:none;border:none;outline:none;color:var(--text-normal);
    padding:11px 8px;font-size:15px;
  }
  #no-chat{margin:auto;color:var(--text-muted);text-align:center;}

  /* ---------- modals ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;}
  .hidden{display:none !important;}
  .modal{background:var(--bg-floating);border-radius:8px;width:440px;max-width:90vw;padding:16px;}
  .modal h2{margin:0 0 4px;font-size:20px;}
  .modal p.sub{color:var(--text-muted);font-size:14px;margin:0 0 16px;}
  .field-label{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;display:block;}
  .field-input{
    width:100%;background:var(--bg-input);border:none;border-radius:4px;
    padding:10px;color:var(--text-normal);font-size:15px;outline:none;margin-bottom:14px;
  }
  .btn{
    background:var(--blurple);color:#fff;border:none;border-radius:4px;
    padding:10px 18px;font-size:14px;font-weight:500;cursor:pointer;
  }
  .btn:hover{background:var(--blurple-hover);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn-secondary{background:none;color:var(--text-normal);}
  .btn-secondary:hover{text-decoration:underline;background:none;}
  .modal-close{position:absolute;cursor:pointer;color:var(--text-muted);}
  .modal-row{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}
  .search-result{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;}
  .search-result:hover{background:var(--bg-modifier-hover);}
  .search-result-info{flex:1;min-width:0;}
  .search-results{max-height:240px;overflow-y:auto;margin-top:4px;}
  .toast{margin-top:10px;color:var(--green);font-size:13px;}

  /* settings */
  .toggle{width:40px;height:22px;border-radius:11px;background:#80848e;position:relative;cursor:pointer;border:none;flex-shrink:0;}
  .toggle.on{background:var(--green);}
  .toggle .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;}
  .toggle.on .knob{left:20px;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg-input);padding:10px 12px;border-radius:6px;margin-bottom:10px;}
  .settings-row-label{flex:1;font-size:14px;}
  .avatar-upload-wrap{position:relative;width:80px;height:80px;margin:0 auto 6px;}
  .avatar-upload-btn{
    position:absolute;bottom:-2px;right:-2px;width:28px;height:28px;border-radius:50%;
    background:var(--blurple);border:3px solid var(--bg-floating);display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:#fff;font-size:13px;
  }

  /* ---------- call overlay ---------- */
  #call-overlay{position:fixed;inset:0;background:#0a0a0c;z-index:200;display:flex;flex-direction:column;}
  #call-top{padding:16px 24px;color:var(--text-muted);font-size:13px;display:flex;justify-content:space-between;}
  #call-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;}
  #remote-video{max-width:100%;max-height:100%;border-radius:8px;background:#000;}
  #call-avatar-view{display:flex;flex-direction:column;align-items:center;gap:14px;}
  #local-video-wrap{
    position:absolute;bottom:20px;right:20px;width:200px;height:130px;border-radius:10px;
    overflow:hidden;border:2px solid var(--blurple);background:#000;
  }
  #local-video{width:100%;height:100%;object-fit:cover;}
  #call-controls{display:flex;justify-content:center;gap:16px;padding:24px 0 40px;}
  .call-btn{
    width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;background:#3a3d44;
  }
  .call-btn.active{background:var(--blurple);}
  .call-btn.end{background:var(--red);}
  .call-btn.danger-toggle{background:var(--red);}
  #incoming-call{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:300;
    background:var(--bg-floating);border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  #incoming-call button{border:none;border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;}
  .accept-btn{background:var(--green);color:#fff;}
  .decline-btn{background:var(--red);color:#fff;}

  /* login */
  #login-screen{
    position:fixed;inset:0;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;z-index:500;
  }
  #login-box{background:var(--bg-floating);border-radius:8px;padding:32px;width:400px;max-width:90vw;text-align:center;}
  #login-box h1{margin:0 0 8px;font-size:24px;}
  #login-box p{color:var(--text-muted);font-size:14px;margin:0 0 20px;}
  #loading-screen{
    position:fixed;inset:0;background:var(--bg-tertiary);display:flex;align-items:center;justify-content:center;
    z-index:500;color:var(--text-muted);font-size:14px;
  }

  /* ---------- missed call ---------- */
  #call-missed{
    position:absolute;bottom:120px;left:50%;transform:translateX(-50%);
    background:var(--bg-floating);padding:16px 22px;border-radius:10px;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  #call-missed .btn{margin:0 4px;}

  /* ---------- badge ---------- */
  .badge-verified{color:#5865f2;margin-left:2px;font-size:14px;}

  /* ---------- mobile ---------- */
  #back-to-friends-btn{display:none;}
  @media (max-width:768px){
    #rail{width:56px;}
    #sidebar{width:100%;flex:1;display:flex;flex-direction:column;}
    #user-bar{display:flex !important;}
    #app.chat-open #sidebar,
    #app.chat-open #rail{display:none;}
    #app:not(.chat-open) #main{display:none;}
    #back-to-friends-btn{display:flex !important;}
    #local-video-wrap{width:120px;height:80px;bottom:12px;right:12px;}
    #call-missed{bottom:130px;width:85%;}
  }
</style>
</head>
<body>

<div id="loading-screen">Загрузка...</div>

<div id="login-screen" class="hidden">
  <div id="login-box">
    <h1>Bitrate</h1>
    <p>Придумай юзернейм, чтобы друзья могли тебя найти.</p>
    <input id="login-username" class="field-input" placeholder="ваш_юзернейм" autocomplete="off" />
    <div id="login-error" style="color:#f23f43;font-size:13px;margin-bottom:10px;min-height:16px;"></div>
    <button class="btn" id="login-btn" style="width:100%;">Продолжить</button>
  </div>
</div>

<div id="app" class="hidden">
  <div id="rail">
    <button class="rail-btn active" title="Личные сообщения">💬</button>
    <div class="rail-spacer"></div>
  </div>

  <div id="sidebar">
    <div id="search-bar"><input placeholder="Найти или начать диалог" disabled /></div>
    <div id="friends-header">
      <span>Личные сообщения</span>
      <button id="add-friend-btn" title="Добавить друга">➕</button>
    </div>
    <div id="friend-list"></div>
    <div id="user-bar">
      <div class="avatar" id="my-avatar" style="width:32px;height:32px;font-size:13px;"></div>
      <div class="user-bar-info">
        <div class="user-bar-name" id="my-nickname"></div>
        <div class="user-bar-tag" id="my-username"></div>
      </div>
      <button class="icon-btn" id="settings-btn-bar" title="Настройки">⚙️</button>
    </div>
  </div>

  <div id="main">
    <div id="no-chat">Выбери друга слева, чтобы начать переписку</div>
    <div id="chat-view" class="hidden" style="display:flex;flex-direction:column;height:100%;">
      <div id="chat-header">
        <div class="header-left">
          <button class="icon-btn" id="back-to-friends-btn" title="Назад">←</button>
          <div class="avatar" id="chat-avatar" style="width:24px;height:24px;font-size:11px;"></div>
          <span id="chat-title"></span>
        </div>
        <div class="header-right">
          <button class="icon-btn" id="call-audio-btn" title="Аудиозвонок">📞</button>
          <button class="icon-btn" id="call-video-btn" title="Видеозвонок">🎥</button>
        </div>
      </div>
      <div id="messages"></div>
      <div id="composer">
        <div class="composer-box">
          <input id="message-input" placeholder="Написать сообщение..." autocomplete="off" />
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add friend modal -->
<div class="overlay hidden" id="add-friend-overlay">
  <div class="modal" style="position:relative;">
    <span class="modal-close" id="close-add-friend" style="top:16px;right:16px;">✕</span>
    <h2>Добавить друга</h2>
    <p class="sub">Можно добавить по юзернейму.</p>
    <input class="field-input" id="friend-search-input" placeholder="Введите юзернейм" autocomplete="off" />
    <div class="search-results" id="friend-search-results"></div>
    <div class="toast hidden" id="add-friend-toast"></div>
  </div>
</div>

<!-- Settings modal -->
<div class="overlay hidden" id="settings-overlay">
  <div class="modal" style="position:relative;">
    <span class="modal-close" id="close-settings" style="top:16px;right:16px;">✕</span>
    <h2>Настройки профиля</h2>
    <div class="avatar-upload-wrap">
      <div class="avatar" id="settings-avatar" style="width:80px;height:80px;font-size:28px;"></div>
      <label class="avatar-upload-btn">📷<input type="file" id="avatar-input" accept="image/*" style="display:none;" /></label>
    </div>

    <label class="field-label" style="margin-top:10px;">Никнейм</label>
    <input class="field-input" id="nickname-input" placeholder="Ваше отображаемое имя" />

    <label class="field-label">Юзернейм (раз в 7 дней)</label>
    <input class="field-input" id="username-input" placeholder="ваш_юзернейм" />
    <div id="username-error" style="color:var(--red);font-size:12px;margin-top:-10px;margin-bottom:10px;" class="hidden"></div>

    <div class="settings-row">
      <span class="settings-row-label">🌙 Светлая тема</span>
      <button class="toggle" id="theme-toggle-settings"><span class="knob"></span></button>
    </div>

    <div class="modal-row">
      <button class="btn" id="save-settings-btn">Готово</button>
    </div>
  </div>
</div>

<!-- Incoming call banner -->
<div id="incoming-call" class="hidden">
  <div class="avatar" id="incoming-avatar" style="width:40px;height:40px;"></div>
  <div>
    <div style="font-weight:600;" id="incoming-name"></div>
    <div style="font-size:12px;color:var(--text-muted);" id="incoming-type"></div>
  </div>
  <button class="accept-btn" id="accept-call-btn">Принять</button>
  <button class="decline-btn" id="decline-call-btn">Отклонить</button>
</div>

<!-- Call overlay -->
<div id="call-overlay" class="hidden">
  <div id="call-top">
    <span id="call-status-text">Звонок...</span>
    <span id="call-timer">00:00</span>
  </div>
  <div id="call-stage">
    <div id="call-avatar-view">
      <div class="avatar" id="call-remote-avatar" style="width:120px;height:120px;font-size:42px;"></div>
      <div id="call-remote-name" style="font-size:20px;font-weight:600;"></div>
      <div id="call-hint" style="color:var(--text-muted);font-size:13px;"></div>
    </div>
    <video id="remote-video" autoplay playsinline class="hidden"></video>
    <div id="local-video-wrap" class="hidden"><video id="local-video" autoplay muted playsinline></video></div>
    <div id="call-missed" class="hidden">
      <div style="margin-bottom:10px;font-size:14px;">Абонент не отвечает</div>
      <button class="btn" id="recall-btn">Перезвонить</button>
      <button class="btn btn-secondary" id="exit-missed-btn">Выйти</button>
    </div>
  </div>
  <div id="call-controls">
    <button class="call-btn active" id="toggle-mic-btn" title="Микрофон">🎙️</button>
    <button class="call-btn" id="toggle-cam-btn" title="Камера">🎥</button>
    <button class="call-btn" id="toggle-share-btn" title="Демонстрация экрана">🖥️</button>
    <button class="call-btn end" id="end-call-btn" title="Завершить">📵</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, updateDoc, addDoc, collection,
  query, where, orderBy, limit, onSnapshot, serverTimestamp, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ---------- YOUR FIREBASE CONFIG ----------
const firebaseConfig = {
  apiKey: "AIzaSyD0U_7IJTQS_Lo6vMVp4l4_wIYlvxeG8Rg",
  authDomain: "bitrate-71684.firebaseapp.com",
  projectId: "bitrate-71684",
  storageBucket: "bitrate-71684.firebasestorage.app",
  messagingSenderId: "794345122154",
  appId: "1:794345122154:web:c4701256885a2c96895d13",
  measurementId: "G-NLE2B4YCXL"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// ---------- state ----------
let me = null; // { uid, username, nickname, avatar, isVerified, lastUsernameChange }
let friends = [];
let activeFriend = null;
let unsubMessages = null;
let unsubFriends = null;
let unsubIncoming = null;
let unsubCallDoc = null;
let theme = localStorage.getItem("bitrate-theme") || "dark";

const ADMIN_USERNAME = "tamirlan_dev";

// ---------- helpers ----------
function $(id){ return document.getElementById(id); }
function initials(name){ return (name||"?").slice(0,2).toUpperCase(); }
function pairId(a,b){ return [a,b].sort().join("_"); }
function fmtTime(ts){
  const d = ts?.toDate ? ts.toDate() : new Date();
  return d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}
function renderAvatar(el, name, avatarUrl, size){
  el.innerHTML = "";
  if(avatarUrl){
    const img = document.createElement("img");
    img.src = avatarUrl;
    el.appendChild(img);
  } else {
    el.textContent = initials(name);
  }
}
function applyTheme(){
  document.body.classList.toggle("light", theme === "light");
  $("theme-toggle-settings").classList.toggle("on", theme === "light");
  localStorage.setItem("bitrate-theme", theme);
}
function toggleTheme(){ theme = theme === "light" ? "dark" : "light"; applyTheme(); }

// ---------- auth / login ----------
onAuthStateChanged(auth, async (user) => {
  if(!user) return;
  try{
    const userDoc = await getDoc(doc(db, "users", user.uid));
    $("loading-screen").classList.add("hidden");
    if(userDoc.exists()){
      me = { uid: user.uid, ...userDoc.data() };
      enterApp();
    } else {
      $("login-screen").classList.remove("hidden");
      $("app").classList.add("hidden");
    }
  }catch(e){
    $("loading-screen").classList.add("hidden");
    $("login-screen").classList.remove("hidden");
    $("login-error").textContent = "Ошибка подключения: " + e.message;
  }
});

signInAnonymously(auth).catch((e) => {
  $("loading-screen").classList.add("hidden");
  $("login-screen").classList.remove("hidden");
  $("login-error").textContent = "Не удалось подключиться к Firebase: " + e.message;
});

$("login-btn").onclick = async () => {
  const raw = $("login-username").value.trim().toLowerCase();
  $("login-error").textContent = "";
  if(!/^[a-z0-9_.]{3,20}$/.test(raw)){
    $("login-error").textContent = "3-20 символов: латиница, цифры, _ .";
    return;
  }
  const user = auth.currentUser;
  if(!user){ $("login-error").textContent = "Нет соединения, попробуйте ещё раз."; return; }

  // check username taken
  try{
    const { getDocs } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const q = query(collection(db,"users"), where("username","==",raw), limit(1));
    const takenSnap = await getDocs(q);
    if(!takenSnap.empty && takenSnap.docs[0].id !== user.uid){
      $("login-error").textContent = "Этот юзернейм уже занят.";
      return;
    }
  }catch(e){}

  const profile = { 
    username: raw, 
    nickname: raw, 
    avatar: null, 
    isVerified: raw === ADMIN_USERNAME,
    lastUsernameChange: serverTimestamp(),
    createdAt: serverTimestamp() 
  };
  await setDoc(doc(db,"users",user.uid), profile);
  me = { uid: user.uid, ...profile };
  enterApp();
};
$("login-username").addEventListener("keydown", (e) => { if(e.key === "Enter") $("login-btn").click(); });

function enterApp(){
  $("login-screen").classList.add("hidden");
  $("app").classList.remove("hidden");
  applyTheme();
  renderMyProfile();
  listenFriends();
  listenIncomingCalls();
}

function renderMyProfile(){
  renderAvatar($("my-avatar"), me.nickname, me.avatar);
  
  const verifiedBadge = me.isVerified ? '<span class="badge-verified" title="Официальная галочка">☑️</span>' : '';
  $("my-nickname").innerHTML = `${me.nickname}${verifiedBadge}`;
  $("my-username").textContent = "@" + me.username;
  
  renderAvatar($("settings-avatar"), me.nickname, me.avatar);
  $("nickname-input").value = me.nickname;
  $("username-input").value = me.username;
}

// ---------- friends ----------
function listenFriends(){
  if(unsubFriends) unsubFriends();
  const q = collection(db, "users", me.uid, "friends");
  unsubFriends = onSnapshot(q, (snap) => {
    friends = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
    renderFriendList();
  });
}

function renderFriendList(){
  const list = $("friend-list");
  list.innerHTML = "";
  if(friends.length === 0){
    list.innerHTML = '<div class="empty-hint">Пока никого нет.<br>Нажми ➕ и найди друга по юзернейму.</div>';
    return;
  }
  friends.forEach(f => {
    const item = document.createElement("div");
    item.className = "friend-item" + (activeFriend?.uid === f.uid ? " active" : "");
    const av = document.createElement("div");
    av.className = "avatar";
    av.style.width = "32px"; av.style.height = "32px"; av.style.fontSize = "13px";
    renderAvatar(av, f.nickname, f.avatar);
    const info = document.createElement("div");
    info.style.minWidth = "0"; info.style.flex = "1";
    const verifiedBadge = f.isVerified ? '<span class="badge-verified">☑️</span>' : '';
    info.innerHTML = `<div class="friend-name">${f.nickname}${verifiedBadge}</div><div class="friend-status">@${f.username}</div>`;
    item.appendChild(av); item.appendChild(info);
    item.onclick = () => openChat(f);
    list.appendChild(item);
  });
}

$("add-friend-btn").onclick = () => { $("add-friend-overlay").classList.remove("hidden"); $("friend-search-input").focus(); };
$("close-add-friend").onclick = () => { $("add-friend-overlay").classList.add("hidden"); $("friend-search-input").value=""; $("friend-search-results").innerHTML=""; };
$("back-to-friends-btn").onclick = () => { $("app").classList.remove("chat-open"); };

let searchTimeout;
let searchToken = 0;
$("friend-search-input").addEventListener("input", (e) => {
  clearTimeout(searchTimeout);
  const val = e.target.value.trim().toLowerCase();
  searchTimeout = setTimeout(() => runFriendSearch(val), 250);
});

async function runFriendSearch(val){
  const myToken = ++searchToken;
  const box = $("friend-search-results");
  if(!val){ box.innerHTML = ""; return; }
  const { getDocs } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const q = query(
    collection(db,"users"),
    orderBy("username"),
    where("username", ">=", val),
    where("username", "<=", val + "\uf8ff"),
    limit(8)
  );
  const snap = await getDocs(q);
  if(myToken !== searchToken) return;
  box.innerHTML = "";
  const results = snap.docs
    .map(d => ({ uid: d.id, ...d.data() }))
    .filter(u => u.uid !== me.uid && !friends.some(f => f.uid === u.uid));
  if(results.length === 0){
    box.innerHTML = '<div class="empty-hint">Никого не найдено</div>';
    return;
  }
  results.forEach(u => {
    const row = document.createElement("div");
    row.className = "search-result";
    const av = document.createElement("div");
    av.className = "avatar"; av.style.width="32px"; av.style.height="32px"; av.style.fontSize="13px";
    renderAvatar(av, u.nickname, u.avatar);
    const info = document.createElement("div");
    info.className = "search-result-info";
    const verifiedBadge = u.isVerified ? '<span class="badge-verified">☑️</span>' : '';
    info.innerHTML = `<div style="font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;">${u.nickname}${verifiedBadge}</div><div style="font-size:12px;color:var(--text-muted);">@${u.username}</div>`;
    
    const actions = document.createElement("div");
    actions.style.display = "flex";
    actions.style.gap = "6px";

    // Admin option for tamirlan_dev
    if (me.username === ADMIN_USERNAME) {
      const adminBtn = document.createElement("button");
      adminBtn.className = "btn";
      adminBtn.style.padding = "6px 10px";
      adminBtn.style.fontSize = "12px";
      adminBtn.style.background = u.isVerified ? "var(--red)" : "var(--green)";
      adminBtn.textContent = u.isVerified ? "Забрать ☑️" : "Дать ☑️";
      adminBtn.onclick = async () => {
        const newStatus = !u.isVerified;
        await updateDoc(doc(db, "users", u.uid), { isVerified: newStatus });
        u.isVerified = newStatus;
        runFriendSearch(val);
      };
      actions.appendChild(adminBtn);
    }

    const btn = document.createElement("button");
    btn.className = "btn"; btn.textContent = "Добавить"; btn.style.padding="6px 12px"; btn.style.fontSize="12px";
    btn.onclick = async () => {
      await setDoc(doc(db,"users",me.uid,"friends",u.uid), {
        username: u.username, nickname: u.nickname, avatar: u.avatar || null, isVerified: !!u.isVerified, addedAt: serverTimestamp()
      });
      $("add-friend-toast").textContent = `${u.username} добавлен в друзья`;
      $("add-friend-toast").classList.remove("hidden");
      setTimeout(() => $("add-friend-toast").classList.add("hidden"), 2000);
      runFriendSearch(val);
    };
    actions.appendChild(btn);

    row.appendChild(av); row.appendChild(info); row.appendChild(actions);
    box.appendChild(row);
  });
}

// ---------- chat ----------
function openChat(friend){
  activeFriend = friend;
  renderFriendList();
  $("no-chat").classList.add("hidden");
  $("chat-view").classList.remove("hidden");
  $("app").classList.add("chat-open");
  renderAvatar($("chat-avatar"), friend.nickname, friend.avatar);
  
  const verifiedBadge = friend.isVerified ? '<span class="badge-verified">☑️</span>' : '';
  $("chat-title").innerHTML = `${friend.nickname}${verifiedBadge}`;

  if(unsubMessages) unsubMessages();
  const chatId = pairId(me.uid, friend.uid);
  const q = query(collection(db,"chats",chatId,"messages"), orderBy("createdAt"), limit(200));
  unsubMessages = onSnapshot(q, (snap) => {
    const msgs = snap.docs.map(d => d.data());
    renderMessages(msgs);
  });
}

function renderMessages(msgs){
  const box = $("messages");
  box.innerHTML = "";
  if(msgs.length === 0){
    box.innerHTML = `<div id="empty-chat">Начните переписку с ${activeFriend.nickname}</div>`;
    return;
  }
  msgs.forEach(m => {
    const row = document.createElement("div");
    row.className = "msg-row";
    const isMe = m.from === me.uid;
    const name = isMe ? me.nickname : activeFriend.nickname;
    const isVerified = isMe ? me.isVerified : activeFriend.isVerified;
    const verifiedBadge = isVerified ? '<span class="badge-verified">☑️</span>' : '';
    
    const av = document.createElement("div");
    av.className = "avatar"; av.style.width="40px"; av.style.height="40px"; av.style.fontSize="14px";
    renderAvatar(av, name, isMe ? me.avatar : activeFriend.avatar);
    const body = document.createElement("div");
    body.className = "msg-body";
    body.innerHTML = `<div class="msg-meta"><span class="msg-author">${name}${verifiedBadge}</span><span class="msg-time">${fmtTime(m.createdAt)}</span></div><div class="msg-text"></div>`;
    body.querySelector(".msg-text").textContent = m.text;
    row.appendChild(av); row.appendChild(body);
    box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight;
}

$("message-input").addEventListener("keydown", async (e) => {
  if(e.key !== "Enter") return;
  const text = e.target.value.trim();
  if(!text || !activeFriend) return;
  e.target.value = "";
  const chatId = pairId(me.uid, activeFriend.uid);
  await addDoc(collection(db,"chats",chatId,"messages"), {
    from: me.uid, text, createdAt: serverTimestamp()
  });
});

// ---------- settings ----------
function openSettings(){ 
  $("nickname-input").value = me.nickname || "";
  $("username-input").value = me.username || "";
  $("username-error").classList.add("hidden");
  $("settings-overlay").classList.remove("hidden"); 
}
$("settings-btn-bar").onclick = openSettings;
$("close-settings").onclick = () => $("settings-overlay").classList.add("hidden");
$("theme-toggle-settings").onclick = toggleTheme;

$("avatar-input").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    me.avatar = reader.result;
    renderAvatar($("settings-avatar"), me.nickname, me.avatar);
  };
  reader.readAsDataURL(file);
});

$("save-settings-btn").onclick = async () => {
  $("username-error").classList.add("hidden");
  const newNickname = $("nickname-input").value.trim() || me.username;
  const newUsername = $("username-input").value.trim().toLowerCase();

  const updateData = { nickname: newNickname, avatar: me.avatar || null };

  // Логика смены юзернейма и проверки на 7 дней
  if (newUsername !== me.username) {
    if(!/^[a-z0-9_.]{3,20}$/.test(newUsername)){
      $("username-error").textContent = "3-20 символов: латиница, цифры, _ .";
      $("username-error").classList.remove("hidden");
      return;
    }

    const lastChange = me.lastUsernameChange?.toDate ? me.lastUsernameChange.toDate().getTime() : 0;
    const sevenDays = 7 * 24 * 60 * 60 * 1000;
    
    if (lastChange && (Date.now() - lastChange < sevenDays)) {
      const daysLeft = Math.ceil((sevenDays - (Date.now() - lastChange)) / (1000 * 60 * 60 * 24));
      $("username-error").textContent = `Сменить юзернейм можно будет только через ${daysLeft} дн.`;
      $("username-error").classList.remove("hidden");
      return;
    }

    // Проверка занятости юзернейма
    try {
      const { getDocs } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      const q = query(collection(db,"users"), where("username","==",newUsername), limit(1));
      const takenSnap = await getDocs(q);
      if(!takenSnap.empty && takenSnap.docs[0].id !== me.uid){
        $("username-error").textContent = "Этот юзернейм уже занят.";
        $("username-error").classList.remove("hidden");
        return;
      }
    } catch(e) {}

    updateData.username = newUsername;
    updateData.lastUsernameChange = serverTimestamp();
    me.username = newUsername;
  }

  await updateDoc(doc(db,"users",me.uid), updateData);
  me.nickname = newNickname;
  renderMyProfile();
  $("settings-overlay").classList.add("hidden");
};

// ================= CALLS (WebRTC + Firestore signaling) =================
const servers = { iceServers: [{ urls: ["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"] }] };
let pc = null;
let localStream = null;
let currentCallId = null;
let unsubOfferCand = null, unsubAnswerCand = null;
let callTimerInterval = null;
let callSeconds = 0;
let micOn = true, camOn = true, sharing = false;
let noAnswerTimer = null;
let lastCallFriend = null, lastCallType = null;

function listenIncomingCalls(){
  const q = query(collection(db,"calls"), where("calleeId","==",me.uid), where("status","==","ringing"));
  unsubIncoming = onSnapshot(q, (snap) => {
    snap.docChanges().forEach((change) => {
      if(change.type === "added"){
        showIncomingCall({ id: change.doc.id, ...change.doc.data() });
      }
      if(change.type === "modified" && change.doc.data().status !== "ringing"){
        $("incoming-call").classList.add("hidden");
      }
    });
  });
}

function showIncomingCall(call){
  $("incoming-call").classList.remove("hidden");
  const friend = friends.find(f => f.uid === call.callerId) || { nickname: "Неизвестный", username: "" };
  renderAvatar($("incoming-avatar"), friend.nickname, friend.avatar);
  $("incoming-name").textContent = friend.nickname;
  $("incoming-type").textContent = (call.type === "video" ? "Видеозвонок" : "Аудиозвонок") + "...";

  $("accept-call-btn").onclick = async () => {
    $("incoming-call").classList.add("hidden");
    try{ await answerCall(call, friend); }
    catch(e){ alert("Не удалось принять звонок: " + e.message); }
  };
  $("decline-call-btn").onclick = async () => {
    $("incoming-call").classList.add("hidden");
    try{ await updateDoc(doc(db,"calls",call.id), { status: "ended" }); }catch(e){}
  };
}

async function getMedia(withVideo){
  try{
    return await navigator.mediaDevices.getUserMedia({ audio: true, video: withVideo });
  }catch(e){
    alert("Нет доступа к камере/микрофону: " + e.message);
    throw e;
  }
}

function createPC(){
  pc = new RTCPeerConnection(servers);
  pc.ontrack = (event) => {
    const remoteVideo = $("remote-video");
    remoteVideo.srcObject = event.streams[0];
  };
  return pc;
}

function openCallOverlay(friend, type){
  $("call-overlay").classList.remove("hidden");
  $("call-missed").classList.add("hidden");
  renderAvatar($("call-remote-avatar"), friend.nickname, friend.avatar);
  $("call-remote-name").textContent = friend.nickname;
  $("call-hint").textContent = "Соединение...";
  $("call-status-text").textContent = type === "video" ? "Видеозвонок" : "Аудиозвонок";
  $("remote-video").classList.toggle("hidden", true);
  $("call-avatar-view").classList.remove("hidden");
  $("local-video-wrap").classList.toggle("hidden", type !== "video");
  callSeconds = 0;
  $("call-timer").textContent = "00:00";
  clearInterval(callTimerInterval);
  callTimerInterval = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds/60)).padStart(2,"0");
    const s = String(callSeconds%60).padStart(2,"0");
    $("call-timer").textContent = `${m}:${s}`;
  }, 1000);
}

$("remote-video").onloadeddata = () => {
  $("call-avatar-view").classList.add("hidden");
  $("remote-video").classList.remove("hidden");
  $("call-hint").textContent = "";
};

async function startCall(friend, type){
  createPC();
  localStream = await getMedia(type === "video");
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  $("local-video").srcObject = localStream;

  const callRef = doc(collection(db,"calls"));
  currentCallId = callRef.id;
  const offerCandidates = collection(callRef, "offerCandidates");
  const answerCandidates = collection(callRef, "answerCandidates");

  pc.onicecandidate = (e) => { if(e.candidate) addDoc(offerCandidates, e.candidate.toJSON()); };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await setDoc(callRef, {
    offer: { type: offer.type, sdp: offer.sdp },
    callerId: me.uid, calleeId: friend.uid, type, status: "ringing", createdAt: serverTimestamp()
  });

  openCallOverlay(friend, type);
  lastCallFriend = friend; lastCallType = type;

  clearTimeout(noAnswerTimer);
  noAnswerTimer = setTimeout(async () => {
    try{
      const snap = await getDoc(callRef);
      if(snap.exists() && snap.data().status === "ringing"){
        await updateDoc(callRef, { status: "missed" });
      }
    }catch(e){}
  }, 30000);

  unsubCallDoc = onSnapshot(callRef, (snap) => {
    const data = snap.data();
    if(!data) return;
    if(data.answer && pc.signalingState !== "stable"){
      pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      clearTimeout(noAnswerTimer);
    }
    if(data.status === "ended") teardownCall();
    if(data.status === "missed") showMissedCall();
  });
  unsubAnswerCand = onSnapshot(answerCandidates, (snap) => {
    snap.docChanges().forEach(c => { if(c.type==="added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  });
}

function showMissedCall(){
  clearInterval(callTimerInterval);
  clearTimeout(noAnswerTimer);
  $("call-hint").textContent = "";
  $("call-status-text").textContent = "Не отвечает";
  $("call-missed").classList.remove("hidden");
}

async function answerCall(call, friend){
  createPC();
  localStream = await getMedia(call.type === "video");
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  $("local-video").srcObject = localStream;

  currentCallId = call.id;
  const callRef = doc(db,"calls",call.id);
  const offerCandidates = collection(callRef, "offerCandidates");
  const answerCandidates = collection(callRef, "answerCandidates");

  pc.onicecandidate = (e) => { if(e.candidate) addDoc(answerCandidates, e.candidate.toJSON()); };

  await pc.setRemoteDescription(new RTCSessionDescription(call.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await updateDoc(callRef, { answer: { type: answer.type, sdp: answer.sdp }, status: "active" });

  openCallOverlay(friend, call.type);

  unsubOfferCand = onSnapshot(offerCandidates, (snap) => {
    snap.docChanges().forEach(c => { if(c.type==="added") pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  });
  unsubCallDoc = onSnapshot(callRef, (snap) => {
    if(snap.data()?.status === "ended") teardownCall();
  });
}

function teardownCall(){
  clearInterval(callTimerInterval);
  clearTimeout(noAnswerTimer);
  if(unsubOfferCand) unsubOfferCand();
  if(unsubAnswerCand) unsubAnswerCand();
  if(unsubCallDoc) unsubCallDoc();
  if(pc){ pc.close(); pc = null; }
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
  $("call-overlay").classList.add("hidden");
  $("call-missed").classList.add("hidden");
  $("remote-video").srcObject = null;
  $("local-video").srcObject = null;
  currentCallId = null;
  sharing = false; micOn = true; camOn = true;
  $("toggle-mic-btn").classList.add("active");
  $("toggle-cam-btn").classList.remove("active");
  $("toggle-share-btn").classList.remove("active");
}

$("recall-btn").onclick = async () => {
  $("call-missed").classList.add("hidden");
  const friend = lastCallFriend, type = lastCallType;
  teardownCall();
  if(friend) await startCall(friend, type);
};
$("exit-missed-btn").onclick = () => {
  teardownCall();
};

$("call-audio-btn").onclick = () => activeFriend && startCall(activeFriend, "audio");
$("call-video-btn").onclick = () => activeFriend && startCall(activeFriend, "video");

$("end-call-btn").onclick = async () => {
  if(currentCallId){ try{ await updateDoc(doc(db,"calls",currentCallId), { status:"ended" }); }catch(e){} }
  teardownCall();
};

$("toggle-mic-btn").onclick = () => {
  if(!localStream) return;
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => t.enabled = micOn);
  $("toggle-mic-btn").classList.toggle("active", micOn);
};
$("toggle-cam-btn").onclick = () => {
  if(!localStream) return;
  camOn = !camOn;
  localStream.getVideoTracks().forEach(t => t.enabled = camOn);
  $("toggle-cam-btn").classList.toggle("active", camOn);
};
$("toggle-share-btn").onclick = async () => {
  if(!pc) return;
  if(!sharing){
    try{
      const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const screenTrack = screenStream.getVideoTracks()[0];
      const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
      if(sender) sender.replaceTrack(screenTrack); else pc.addTrack(screenTrack, screenStream);
      $("local-video").srcObject = screenStream;
      $("local-video-wrap").classList.remove("hidden");
      sharing = true;
      $("toggle-share-btn").classList.add("active");
      screenTrack.onended = () => stopShare(sender);
    }catch(e){ /* user cancelled */ }
  } else {
    const sender = pc.getSenders().find(s => s.track && s.track.kind === "video");
    stopShare(sender);
  }
};
function stopShare(sender){
  const camTrack = localStream?.getVideoTracks()[0];
  if(sender && camTrack) sender.replaceTrack(camTrack);
  if(localStream) $("local-video").srcObject = localStream;
  sharing = false;
  $("toggle-share-btn").classList.remove("active");
}
</script>
