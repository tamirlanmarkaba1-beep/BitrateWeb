<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bitrate</title>
<style>
  :root{ --bg-tertiary:#1e1f22; --bg-secondary:#2b2d31; --bg-primary:#313338; --bg-floating:#111214; --bg-input:#1e1f22; --bg-modifier-hover:rgba(78,80,88,.4); --text-normal:#dbdee1; --text-muted:#949ba4; --blurple:#5865f2; --blurple-hover:#4752c4; --green:#23a55a; --red:#f23f43; --divider:#3f4147; }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:"gg sans",sans-serif;background:var(--bg-tertiary);color:var(--text-normal);overflow:hidden;}
  #app{display:flex;height:100vh;width:100vw;}
  .hidden{display:none !important;}
  
  /* Layout */
  #rail{width:72px;background:var(--bg-tertiary);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px;}
  #sidebar{width:240px;background:var(--bg-secondary);display:flex;flex-direction:column;}
  #main{flex:1;display:flex;flex-direction:column;background:var(--bg-primary);}
  
  /* User Bar (Footer) */
  #user-bar{background:var(--bg-secondary);padding:10px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--divider);}
  .user-info{flex:1;min-width:0;}
  .user-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-tag{font-size:12px;color:var(--text-muted);}
  .icon-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:6px;border-radius:4px;}
  .icon-btn:hover{background:var(--bg-modifier-hover);color:var(--text-normal);}

  /* Modals */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal{background:var(--bg-floating);border-radius:8px;padding:20px;width:400px;}
  .field-input{width:100%;background:var(--bg-input);border:none;padding:10px;border-radius:4px;color:var(--text-normal);margin-bottom:10px;}
  .btn{background:var(--blurple);color:#fff;border:none;padding:10px;border-radius:4px;cursor:pointer;width:100%;}
  
  /* Mobile */
  @media (max-width:768px){
    #sidebar{width:100%;}
    #app.chat-open #sidebar{display:none;}
    #app:not(.chat-open) #main{display:none;}
  }
</style>
</head>
<body>

<div id="loading-screen" style="position:fixed;inset:0;background:#1e1f22;display:flex;align-items:center;justify-content:center;color:#949ba4;">Загрузка...</div>

<div id="login-screen" class="hidden">
  <div class="modal">
    <h1>Bitrate</h1>
    <input id="login-username" class="field-input" placeholder="Юзернейм" />
    <div id="login-error" style="color:var(--red);font-size:12px;margin-bottom:10px;"></div>
    <button class="btn" id="login-btn">Войти</button>
  </div>
</div>

<div id="app" class="hidden">
  <div id="rail"><button class="btn" style="width:40px;height:40px;border-radius:50%;">💬</button></div>
  <div id="sidebar">
    <div style="flex:1;overflow-y:auto;" id="friend-list"></div>
    <!-- Твой профиль внизу -->
    <div id="user-bar">
      <div id="my-avatar" style="width:32px;height:32px;border-radius:50%;background:var(--blurple);display:flex;align-items:center;justify-content:center;">?</div>
      <div class="user-info">
        <div class="user-name" id="my-nickname">...</div>
        <div class="user-tag" id="my-username">...</div>
      </div>
      <button class="icon-btn" id="settings-open">⚙️</button>
    </div>
  </div>
  <div id="main">
    <div id="chat-header" style="padding:10px;border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:10px;">
        <button id="back-btn" class="icon-btn" style="display:none;">⬅️</button>
        <span id="chat-title">Выберите чат</span>
    </div>
    <div id="messages" style="flex:1;overflow-y:auto;padding:10px;"></div>
    <div id="composer" style="padding:10px;"><input id="message-input" class="field-input" placeholder="Сообщение..." /></div>
  </div>
</div>

<!-- Модалки -->
<div id="settings-overlay" class="overlay hidden">
  <div class="modal">
    <h2>Настройки</h2>
    <label>Никнейм</label>
    <input id="set-nickname" class="field-input" />
    <label>Юзернейм (раз в 7 дней)</label>
    <input id="set-username" class="field-input" />
    <div id="settings-error" style="color:var(--red);font-size:12px;"></div>
    <button class="btn" id="save-settings">Сохранить</button>
    <button class="btn" style="background:transparent;margin-top:5px;" onclick="document.getElementById('settings-overlay').classList.add('hidden')">Отмена</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp, collection, onSnapshot, orderBy, query, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = { apiKey: "AIzaSyD0U_7IJTQS_Lo6vMVp4l4_wIYlvxeG8Rg", authDomain: "bitrate-71684.firebaseapp.com", projectId: "bitrate-71684", storageBucket: "bitrate-71684.firebasestorage.app", messagingSenderId: "794345122154", appId: "1:794345122154:web:c4701256885a2c96895d13" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let me = null;

  onAuthStateChanged(auth, async (user) => {
    if(!user) { signInAnonymously(auth); return; }
    const snap = await getDoc(doc(db, "users", user.uid));
    if(snap.exists()){
      me = { uid: user.uid, ...snap.data() };
      document.getElementById("loading-screen").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      renderProfile();
    } else {
      document.getElementById("loading-screen").classList.add("hidden");
      document.getElementById("login-screen").classList.remove("hidden");
    }
  });

  function renderProfile(){
    document.getElementById("my-nickname").textContent = me.nickname;
    document.getElementById("my-username").textContent = "@" + me.username;
    document.getElementById("my-avatar").textContent = me.nickname[0].toUpperCase();
    if(me.isVerified) document.getElementById("my-nickname").innerHTML += " ☑️";
  }

  // --- Login ---
  document.getElementById("login-btn").onclick = async () => {
    const val = document.getElementById("login-username").value.trim();
    if(!val) return;
    await setDoc(doc(db, "users", auth.currentUser.uid), {
        username: val, nickname: val, createdAt: serverTimestamp(), lastUsernameChange: serverTimestamp()
    });
    location.reload();
  };

  // --- Settings ---
  document.getElementById("settings-open").onclick = () => {
    document.getElementById("set-nickname").value = me.nickname;
    document.getElementById("set-username").value = me.username;
    document.getElementById("settings-overlay").classList.remove("hidden");
  };

  document.getElementById("save-settings").onclick = async () => {
    const newNick = document.getElementById("set-nickname").value.trim();
    const newUser = document.getElementById("set-username").value.trim();
    const err = document.getElementById("settings-error");
    
    let updateObj = { nickname: newNick };
    
    // Check Username change (7 days)
    if(newUser !== me.username) {
        const last = me.lastUsernameChange?.toDate().getTime() || 0;
        const diff = Date.now() - last;
        const week = 7 * 24 * 60 * 60 * 1000;
        
        if(diff < week) {
            err.textContent = "Сменить юзернейм можно раз в 7 дней.";
            return;
        }
        updateObj.username = newUser;
        updateObj.lastUsernameChange = serverTimestamp();
    }

    await updateDoc(doc(db, "users", me.uid), updateObj);
    location.reload();
  };

  // --- Mobile Back ---
  document.getElementById("back-btn").onclick = () => {
    document.getElementById("app").classList.remove("chat-open");
    document.getElementById("back-btn").style.display = "none";
  };
</script>
</body>
</html>
